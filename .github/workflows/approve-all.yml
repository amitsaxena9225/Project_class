name: Approve All Handler (Multi Repo)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    runs-on: ubuntu-latest

    steps:
      - name: Process APPROVE-ALL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            /************ CONFIG ************/
            const APPROVER = "amitsaxena9225@gmail.com";

            const commentBody = context.payload.comment.body.trim().toUpperCase();
            const commenter  = context.payload.comment.user.login;
            const issue      = context.payload.issue;

            console.log(`Comment: ${commentBody}`);
            console.log(`Commenter: ${commenter}`);

            /************ SECURITY ************/
            if (commentBody !== "APPROVE-ALL") return;
            if (commenter !== APPROVER) return;

            /************ PARSE SUMMARY ************/
            const lines = issue.body.split("\n").filter(l => l.startsWith("• "));
            if (!lines.length) return;

            /************ PROCESS EACH ISSUE ************/
            for (const line of lines) {
              const match = line.match(/• (.+?)\/(.+?)#(\d+)/);
              if (!match) continue;

              const owner = match[1];
              const repo  = match[2];
              const number = Number(match[3]);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: "✅ Approved by amitsaxena9225 via **APPROVE-ALL**"
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: ["approved"]
              });
            }

            /************ CLOSE SUMMARY ************/
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "✅ **All tickets across all repositories have been approved.**"
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed"
            });
