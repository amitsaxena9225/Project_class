name: Approve All Handler (Multi Repo)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    runs-on: ubuntu-latest

    steps:
      - name: Process APPROVE-ALL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            // ===== CONFIG =====
            const APPROVER = "amitsaxena9225"; // boss GitHub username

            // ===== DEBUG LOGS =====
            console.log("Approve workflow triggered");

            const commentBody = context.payload.comment.body.trim().toUpperCase();
            const commenter = context.payload.comment.user.login;
            const issue = context.payload.issue;

            console.log("Comment body:", commentBody);
            console.log("Commenter:", commenter);

            // ===== SECURITY CHECKS =====
            if (commentBody !== "APPROVE-ALL") {
              console.log("Not an APPROVE-ALL comment");
              return;
            }

            if (commenter !== APPROVER) {
              console.log("Commenter not authorized");
              return;
            }

            // ===== PARSE SUMMARY ISSUE =====
            const lines = issue.body
              .split("\n")
              .filter(line => line.startsWith("• "));

            console.log("Parsed lines:", lines);

            if (lines.length === 0) {
              console.log("No issues found in summary");
              return;
            }

            // ===== PROCESS EACH ISSUE =====
            for (const line of lines) {
              const match = line.match(/• ([^/]+)\/([^#]+)#(\d+)/);
              if (!match) {
                console.log("Line did not match:", line);
                continue;
              }

              const owner = match[1];
              const repo = match[2];
              const number = Number(match[3]);

              console.log(`Approving ${owner}/${repo}#${number}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: "Approved via APPROVE-ALL"
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: ["approved"]
              });
            }

            // ===== CLOSE SUMMARY ISSUE =====
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "All tickets approved successfully."
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed"
            });
