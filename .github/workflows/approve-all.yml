name: Approve All Handler (Multi Repo)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    runs-on: ubuntu-latest

    steps:
      - name: Process APPROVE-ALL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            const APPROVER = "XYZ";

            const comment = context.payload.comment.body.trim().toUpperCase();
            const commenter = context.payload.comment.user.login;
            const issue = context.payload.issue;

            if (comment !== "APPROVE-ALL") return;
            if (commenter !== APPROVER) return;

            const lines = issue.body.split("\n").filter(l => l.startsWith("• "));
            if (!lines.length) return;

            for (const line of lines) {
              const match = line.match(/• (.+?)\/(.+?)#(\d+)/);
              if (!match) continue;

              const [_, owner, repo, number] = match;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(number),
                body: "✅ Approved by XYZ via **APPROVE-ALL**"
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: Number(number),
                labels: ["approved"]
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "✅ **All tickets approved successfully.**"
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed"
            });
